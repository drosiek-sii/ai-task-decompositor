<!--/* Beads task: 2ow — Newsroom List render override.
        Only the per-item row markup is overridden; list resolution stays in Core List. */-->
<sly data-sly-use.list="com.qantas.core.models.NewsroomList"/>

<ul class="newsroom-list"
    data-sly-test="${list.items.size > 0}">
    <li data-sly-list.item="${list.items}"
        class="newsroom-list__item">
        <a class="newsroom-list__link" href="${item.link}">${item.title}</a>
        <span class="newsroom-list__meta">
            <span class="newsroom-list__city"
                  data-sly-test="${item.releaseCity}">${item.releaseCity} • </span>
            <time class="newsroom-list__date" datetime="${item.isoDate}">${item.releaseDate}</time>
        </span>
    </li>
</ul>
